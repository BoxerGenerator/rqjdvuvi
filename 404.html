<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page not found</title>
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#08080b">
<style>
:root{--bg:#08080b;--a:#ff3d00;--text:#f4f4f6;--muted:#8b8b93;--line:rgba(255,61,0,.2)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0%,rgba(255,61,0,.16),transparent 55%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:24px}
.wrap{max-width:520px}
.code{font-family:"Arial Black",system-ui,sans-serif;font-size:clamp(88px,22vw,150px);line-height:.9;color:var(--a);letter-spacing:-.04em}
h1{font-size:clamp(20px,3vw,26px);margin:14px 0 8px;letter-spacing:-.01em}
p{color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--a);color:#1a0700;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:13px 24px;border:0;border-radius:6px;cursor:pointer;box-shadow:0 12px 30px rgba(255,61,0,.25)}
.btn:hover{background:#ff5a1f}
.rule{width:56px;height:3px;background:var(--a);margin:0 auto 18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="code">404</div>
  <div class="rule"></div>
  <h1>This page is not here</h1>
  <p>The link is broken, the build was moved, or the URL has a typo. Go back and use the button you came from.</p>
  <button class="btn" onclick="history.length>1?history.back():location.assign('/')">Go back</button>
</div>
</body>
</html>
